name: Bug Report
description: Something in an existing tool is broken or behaves incorrectly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: "json-formatter"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: "Chrome 128 / Windows 11"
