name: New Tool Proposal
description: Propose (or claim) a new small developer tool to add to DevCrate.
title: "[Tool] "
labels: ["new-tool", "good first issue"]
body:
  - type: input
    id: tool-name
    attributes:
      label: Tool name
      description: Short, human-readable name.
      placeholder: "JWT Decoder"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: One or two sentences. Be specific about the input and output.
      placeholder: "Paste a JWT, see the decoded header and payload as formatted JSON, with an expiry warning if the token is expired."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: A short checklist of what "done" looks like. This is what the automated PR review checks the implementation against.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this tool doesn't already exist
          required: true
        - label: I checked `src/tools/` and this isn't already implemented
          required: true
