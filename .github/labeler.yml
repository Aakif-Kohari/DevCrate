new-tool:
  - changed-files:
      - any-glob-to-any-file: 'src/tools/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'package.json'
          - 'vite.config.ts'
          - 'tsconfig.json'
          - 'tailwind.config.js'
          - 'postcss.config.js'
