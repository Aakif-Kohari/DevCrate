name: PR Checks — Scope + AI Review

# Two separate jobs on purpose:
#
# - scope-check: pure deterministic logic (no AI, no external calls,
#   never flaky). Verifies the PR only touches one src/tools/<slug>/
#   folder, and — only when it's introducing a brand-new tool — that
#   it's paired with exactly one added registry entry in registry.ts.
#
# - ai-review: sanity-checks the diff against the linked issue.
#   ADVISORY ONLY — it never blocks a merge, it just posts a comment.
#
# Both jobs need a writable GITHUB_TOKEN (to comment), and ai-review also
# needs the GEMINI_API_KEY secret. Every real contribution to this repo
# comes from a fork (see CONTRIBUTING.md) — and GitHub deliberately hands
# `pull_request`-triggered runs from forks a read-only token with NO
# secrets. On plain `pull_request` that means both jobs below would 403
# the moment they tried to comment (scope-check unconditionally comments,
# even on a pass), and ai-review would never see GEMINI_API_KEY — i.e.
# these checks would never actually work for an outside contributor,
# only for pushes to a branch on this repo itself.
#
# We use `pull_request_target` instead, which runs with the base repo's
# token/secrets even for fork PRs. That's only safe when the job never
# checks out or executes code from the PR branch — and neither job here
# does: both only call read-only GitHub REST APIs (listFiles, getContent,
# issues.get) to build plain text (a scope report / an AI-review prompt)
# and post it as a comment. See:
# https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
#
# The one real cost of pull_request_target: any fork author can trigger
# this workflow repeatedly just by pushing commits (synchronize events),
# and ai-review spends a Gemini call each time. Gating ai-review behind a
# "trusted author" check (the usual advice) doesn't fit this repo — every
# real contributor is an outside, first-time contributor by design (see
# CONTRIBUTING.md), so that would just turn ai-review off for everyone it
# exists for. Instead, ai-review only runs on `opened`/`reopened` (see its
# `if:` below) — one review per PR lifecycle instead of one per push —
# which removes the "push repeatedly to rack up calls" angle without
# requiring a maintainer to manually unlock it per PR. scope-check stays
# on all three events since it's free and deterministic, and should
# re-check scope on every push.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Explicit deny-by-default at the workflow level — each job below grants
# only the specific permissions it actually needs. Flagged by zizmor
# (excessive-permissions) when this was missing, since without it the
# GITHUB_TOKEN falls back to whatever the repo's default permissions are.
permissions: {}

env:
  GEMINI_MODEL: gemini-flash-lite-latest

jobs:
  scope-check:
    name: scope-check
    # Dependabot PRs legitimately touch package.json/package-lock.json/workflow
    # files — the src/tools/** scope rule was never meant to apply to those.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });

            // Fail closed if the PR is too large for the GitHub API to return all files (max 3000 limit)
            if (files.length !== pr.changed_files) {
              const msg = 'The GitHub API only returned ' + files.length + ' out of ' + pr.changed_files + ' changed files (API limit is 3000). Scope check cannot run safely; please review manually.';
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body: '❌ **Scope check skipped**: ' + msg,
              });
              core.setFailed(msg);
              return;
            }

            // Split files into "tool files" (src/tools/<slug>/** or registry.ts)
            // and everything else. The one-tool-per-PR rule only applies once a
            // PR actually touches a tool folder — a docs-only, infra-only, or
            // config-only PR (the Documentation/Polish issue categories) isn't
            // a "new tool" submission and shouldn't be judged as one.
            const violations = [];
            let touchedSlug = null;
            let registryFile = null;
            let metaFileAdded = false;
            const otherFiles = [];

            for (const f of files) {
              if (f.filename === 'src/tools/registry.ts') {
                registryFile = f;
                continue;
              }
              const m = f.filename.match(/^src\/tools\/([^/]+)\//);
              if (!m) {
                otherFiles.push(f.filename);
                continue;
              }
              const slug = m[1];
              if (touchedSlug && touchedSlug !== slug) {
                violations.push('touches files in both `src/tools/' + touchedSlug + '/` and `src/tools/' + slug + '/` — one PR should add exactly one tool');
              }
              touchedSlug = slug;
              // The cheap signal for "this is a new tool": a newly-added meta.ts
              // (see docs/ADDING_A_TOOL.md step 3).
              if (f.filename === 'src/tools/' + slug + '/meta.ts' && f.status === 'added') {
                metaFileAdded = true;
              }
            }

            const touchesATool = touchedSlug !== null || registryFile !== null;

            // Resolve whether this is genuinely a *new* tool. Trust
            // metaFileAdded when true — no need for an extra API call. Only
            // when meta.ts wasn't part of the diff do we check whether the
            // slug's folder already existed on the base branch: this covers
            // both a new-tool PR that forgot meta.ts, and a polish PR that
            // happens to *only* add new files (so every touched file in the
            // diff looks "added" even though the tool itself isn't new).
            let isNewTool = metaFileAdded;
            if (touchedSlug && !isNewTool) {
              try {
                await github.rest.repos.getContent({
                  ...context.repo, path: 'src/tools/' + touchedSlug, ref: pr.base.sha,
                });
                isNewTool = false; // folder already existed on the base branch
              } catch (e) {
                if (e.status === 404) {
                  isNewTool = true; // folder doesn't exist on main yet — this PR introduces it
                }
                // any other error (rate limit, transient API issue): fall back
                // to the meta.ts signal rather than failing scope-check over
                // an unrelated hiccup.
              }
            }

            if (touchedSlug !== null && registryFile === null && isNewTool) {
              violations.push('adds `src/tools/' + touchedSlug + '/` but never touches `src/tools/registry.ts` — a new tool needs exactly one added registry entry there to register it');
            }
            if (registryFile !== null && touchedSlug === null) {
              violations.push('`src/tools/registry.ts` must be paired with exactly one tool folder');
            }
            if (registryFile !== null && touchedSlug !== null && !isNewTool) {
              violations.push('`src/tools/registry.ts` was modified, but `src/tools/' + touchedSlug + '/` isn\'t a new tool — only a brand-new tool needs to touch `registry.ts`; a polish/bugfix PR on an existing tool shouldn\'t');
            }
            if (registryFile !== null && isNewTool) {
              if (registryFile.status !== 'modified') {
                violations.push('`src/tools/registry.ts` was ' + registryFile.status + ', expected a small modification (adding one entry)');
              } else if (registryFile.deletions > 0) {
                violations.push('`src/tools/registry.ts` has ' + registryFile.deletions + ' deleted line(s) — only additions are allowed here');
              } else {
                // Parse the patch to ensure exactly one valid toolRegistry entry was added
                const patch = registryFile.patch || '';
                const addedText = patch.split('\n')
                  .filter(l => l.startsWith('+') && !l.startsWith('+++'))
                  .map(l => l.substring(1)) // remove the '+' diff prefix
                  .join('\n')
                  .replace(/\/\/.*$/gm, '') // strip single-line comments
                  .replace(/\/\*[\s\S]*?\*\//g, ''); // strip multi-line comments

                // Verify imports match the touchedSlug
                const hasMetaImport = new RegExp(`import\\s+\\w+\\s+from\\s+['"]\\./${touchedSlug}/meta['"]`).test(addedText);
                const hasCompImport = new RegExp(`import\\s+\\w+\\s+from\\s+['"]\\./${touchedSlug}['"]`).test(addedText);
                if (!hasMetaImport || !hasCompImport) {
                  violations.push('`src/tools/registry.ts` is missing required imports for `' + touchedSlug + '` (expected `./' + touchedSlug + '/meta` and `./' + touchedSlug + '`)');
                }

                // Count valid registry entries (handles multiple on one line, ignores comments)
                const entryRegex = /\{\s*meta\s*:\s*\w+\s*,\s*Component\s*:\s*\w+\s*,?\s*\}/g;
                const entries = addedText.match(entryRegex) || [];
                if (entries.length !== 1) {
                  violations.push('`src/tools/registry.ts` has ' + entries.length + ' added registry entries — exactly one is expected per tool');
                }
              }
            }

            if (touchesATool && otherFiles.length > 0) {
              violations.push(...otherFiles.map(f => 'also touches `' + f + '`, which is outside `src/tools/**` — keep tool PRs scoped to just the tool'));
            }

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            let body;
            if (!touchesATool) {
              body = '✅ **Scope check passed** — no `src/tools/**` folder touched, so this isn\'t subject to the one-tool-per-PR rule (docs/infra/config change).';
            } else if (violations.length === 0) {
              body = isNewTool
                ? '✅ **Scope check passed** — this PR only touches `src/tools/' + touchedSlug + '/**` plus one added registry entry in `registry.ts`.'
                : '✅ **Scope check passed** — this PR only touches `src/tools/' + touchedSlug + '/**` (polish/bugfix on an existing tool).';
            } else {
              body = '❌ **Scope check failed**:\n' + violations.map(v => '- ' + v).join('\n') + '\n\nSee [`docs/ADDING_A_TOOL.md`](' + repoUrl + '/blob/main/docs/ADDING_A_TOOL.md) — a tool PR should only touch its own folder plus, for new tools, one added registry entry.';
            }

            await github.rest.issues.createComment({
              ...context.repo, issue_number: pr.number, body,
            });

            if (violations.length > 0) {
              core.setFailed(violations.join(' | '));
            }

  ai-review:
    name: ai-review
    # Dependabot bumps get nothing useful from an AI review. Skipping
    # `synchronize` (see the note at the top of this file) means this only
    # runs once per PR lifecycle instead of once per push, which is what
    # keeps a fork author from racking up Gemini calls just by pushing
    # commits repeatedly.
    if: github.actor != 'dependabot[bot]' && github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # No actions/checkout here on purpose: this job never reads from the
      # local filesystem or runs any PR code — it only calls read-only
      # GitHub REST APIs for the diff/issue text below. That's what keeps
      # pull_request_target safe for this job (see the note at the top of
      # this file) — there's nothing from the PR branch to execute.
      #
      # continue-on-error: this job is advisory only and should never show
      # as a failing check — but an uncaught error (a network blip on the
      # `fetch` call, a Gemini rate limit, a transient GitHub API error)
      # would otherwise fail the step, and therefore the job, contradicting
      # that. This keeps it non-blocking even if the call inside errors out.
      - uses: actions/github-script@v7
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!process.env.GEMINI_API_KEY) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number,
                body: "_(AI review is temporarily unavailable — CI and scope-check results above are still valid, this PR may just need a manual look too.)_",
              });
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const diffSummary = files
              .map(f => `--- ${f.filename} (+${f.additions}/-${f.deletions}) ---\n${(f.patch || '(binary or too large for a text diff)').slice(0, 2000)}`)
              .join('\n\n')
              .slice(0, 12000);

            const prBody = pr.body || '';
            const issueMatch = prBody.match(/\b(?:closes|fixes|resolves)\s+#(\d+)/i);
            let issueContext = '(no linked issue found in the PR description — ask the author to add "Closes #N")';
            if (issueMatch) {
              try {
                const { data: linkedIssue } = await github.rest.issues.get({
                  ...context.repo, issue_number: Number(issueMatch[1]),
                });
                issueContext = `Issue #${linkedIssue.number}: ${linkedIssue.title}\n${linkedIssue.body || ''}`.slice(0, 3000);
              } catch (e) { /* issue not found, keep default message */ }
            }

            // Built as an array of lines (not an indented template literal) so the
            // YAML file's own indentation never leaks into the actual prompt text
            // sent to Gemini.
            const prompt = [
              `You are reviewing a pull request on DevCrate, an open-source`,
              `collection of small developer utility tools (one tool per folder under`,
              `src/tools/). A separate automated check already verified this PR's file`,
              `scope — don't repeat that. This review is ADVISORY ONLY: a human maintainer`,
              `reads it and decides whether to merge, nothing merges automatically.`,
              ``,
              `Focus on:`,
              `1. Does the implementation actually satisfy what the linked issue asked for?`,
              `2. Is it reasonably correct and complete (not a stub, no obvious bugs)?`,
              `3. Anything specific a human reviewer should double-check before merging?`,
              ``,
              `LINKED ISSUE:`,
              issueContext,
              ``,
              `DIFF:`,
              diffSummary,
              ``,
              `Write a short review, under 200 words: a 1-2 sentence summary, then a short`,
              `bullet list of anything worth double-checking (or say "Nothing stood out" if`,
              `it looks solid).`,
            ].join('\n');

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${process.env.GEMINI_MODEL}:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
              }
            );
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

            await github.rest.issues.createComment({
              ...context.repo, issue_number: pr.number,
              body: text
                ? `### 🤖 AI Review (advisory — not a merge gate)\n\n${text}`
                : `_(AI review call failed or returned nothing — please review this PR manually. Raw response: ${JSON.stringify(data).slice(0, 300)})_`,
            });
            // Intentionally never calls core.setFailed — this job is informational only.
