name: Auto-assign New Issues to Their Creator

# When someone other than the repository owner opens an issue (almost
# always a "New Tool Proposal"), it gets assigned straight to them —
# opening the issue IS their claim, no separate /claim comment needed.
# Issues opened by the repository owner stay unassigned so the pool is
# open for anyone to /claim.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-to-creator:
    if: github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const creator = context.payload.issue.user.login;
            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: context.payload.issue.number,
              assignees: [creator],
            });
