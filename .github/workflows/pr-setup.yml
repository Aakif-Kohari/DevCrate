name: PR Setup — Default Labels + Assignees

# Runs once when a PR is opened:
#   - applies every label listed in `defaultLabels` in .github/pr-config.json
#     (add or remove names there — no workflow edit needed; labels that don't
#     exist yet are created automatically)
#   - assigns the PR's author and, unless `assignOwner` is false, the
#     repository owner
#
# Status labels (merge-conflict, merge-ready, ...) are handled separately by
# pr-status-labels.yml, since they have to be re-evaluated as a PR changes.
#
# The config is read from the default branch via the API, never from the PR
# branch, so a fork PR can't change which labels or assignees it receives.
#
# pull_request_target, not pull_request: every real contribution here comes
# from a fork (see CONTRIBUTING.md), and a fork's pull_request token is
# read-only with no way to add a label or assignee — see the note at the
# top of ai-pr-review.yml for the full explanation of why. Safe here for
# the same reason as there: no checkout, no code execution, just metadata
# API calls.

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  setup:
    name: setup
    # Dependabot PRs get their own "infra" label via dependabot.yml already,
    # and assigning a bot as an assignee isn't meaningful — this is for
    # human contributor PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # pull-requests: write alone is sufficient for labeling/assigning a PR
    # specifically (as opposed to a plain issue, which needs issues: write) —
    # confirmed against GitHub's own permissions reference.
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const owner = context.repo.owner;

            let config = { defaultLabels: [], assignOwner: true, assignAuthor: true };
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo,
                path: '.github/pr-config.json',
                ref: context.payload.repository.default_branch,
              });
              config = { ...config, ...JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')) };
            } catch (e) {
              core.warning(`Couldn't read .github/pr-config.json (${e.message}) — using built-in defaults.`);
            }

            // --- default labels ---
            const labels = [...new Set(
              (Array.isArray(config.defaultLabels) ? config.defaultLabels : [])
                .map((l) => String(l).trim())
                .filter(Boolean),
            )];
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: pr.number, labels,
              });
            }

            // --- assignees ---
            // No collaborator pre-check: GitHub lets a PR's own author be
            // assigned even without push access, and the old collaborator
            // check meant contributors were never even attempted. Assign
            // everyone in one call, then read the PR back and report honestly
            // if GitHub dropped anyone, instead of assuming it worked.
            const wanted = new Set();
            if (config.assignOwner !== false) wanted.add(owner);
            if (config.assignAuthor !== false) wanted.add(author);
            if (wanted.size === 0) return;

            try {
              await github.rest.issues.addAssignees({
                ...context.repo, issue_number: pr.number, assignees: [...wanted],
              });
            } catch (e) {
              core.warning(`Couldn't assign users to #${pr.number} (${e.message}).`);
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              ...context.repo, issue_number: pr.number,
            });
            const assigned = new Set((issue.assignees || []).map((a) => a.login.toLowerCase()));
            for (const login of wanted) {
              if (assigned.has(login.toLowerCase())) {
                core.info(`Assigned ${login} to #${pr.number}.`);
              } else {
                core.warning(`GitHub did not assign ${login} to #${pr.number} (user isn't assignable in this repo).`);
              }
            }
