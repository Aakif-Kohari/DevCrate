name: Release Drafter

# Keeps a running draft release up to date as PRs merge, categorized by
# label.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
