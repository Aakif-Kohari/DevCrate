name: Release Stale Claims

# Any issue labeled "claimed" that hasn't been touched in 52 hours gets
# unassigned and relabeled "help wanted" so someone else can pick it up.
# Checked every 4 hours to keep actual staleness close to the 52-hour mark.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const STALE_HOURS = 52;
            const cutoff = new Date(Date.now() - STALE_HOURS * 60 * 60 * 1000);

            const claimed = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'claimed', per_page: 100,
            });

            for (const issue of claimed) {
              const updatedAt = new Date(issue.updated_at);
              if (updatedAt > cutoff) continue;

              const assignees = (issue.assignees || []).map(a => a.login);
              if (assignees.length > 0) {
                await github.rest.issues.removeAssignees({
                  ...context.repo, issue_number: issue.number, assignees,
                });
              }
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue.number, name: 'claimed',
              }).catch(() => {});
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ['help wanted'],
              }).catch(() => {});
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `No activity for ${STALE_HOURS}+ hours, so this has been released back to the pool. If you're still working on it, comment \`/claim\` again and pick up where you left off — no penalty, it just keeps the queue moving.`,
              });
            }
