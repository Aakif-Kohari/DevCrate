name: Temporary verify issue 35

on:
  push:
    branches:
      - feat/csv-json-converter-35
    paths:
      - '.github/workflows/temp-verify-35.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
