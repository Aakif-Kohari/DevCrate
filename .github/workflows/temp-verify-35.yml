name: Temporary verify issue 35

on:
  push:
    branches:
      - feat/csv-json-converter-35
    paths:
      - '.github/workflows/temp-verify-35.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/csv-json-converter-35
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write src/tools/csv-json-converter/index.tsx src/tools/csv-json-converter/index.test.tsx
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Burs-IA External Work"
          git config user.email "actions@users.noreply.github.com"
          git add src/tools/csv-json-converter/index.tsx src/tools/csv-json-converter/index.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format CSV JSON converter"
            git push origin HEAD:feat/csv-json-converter-35
          fi
      - run: npm run verify
