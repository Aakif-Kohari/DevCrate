name: Welcome First-Timers

# Posts a one-time welcome message on someone's very first issue and
# their very first PR in this repo.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Welcome, and thanks for opening your first issue here! 🎉 If you're proposing a
            new tool, an automated check will comment shortly with a relevance/duplicate
            check. If you'd like to build it yourself, this issue is already assigned to
            you — no need to comment `/claim`. Check out
            [`docs/ADDING_A_TOOL.md`](../blob/main/docs/ADDING_A_TOOL.md) for the pattern.
            If this project is useful to you, a ⭐ on the repo helps others find it too.
          pr-message: >
            Thanks for opening your first pull request here — that's a big step, welcome!
            🎉 CI and an automated review will run in a few minutes; check back on this PR
            for the results. If you get stuck on anything, feel free to ask right here.
            And if you're enjoying contributing, a ⭐ on the repo goes a long way for a
            project like this.
